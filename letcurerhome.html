<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Dashboard | E4U</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
    .news-wrapper{
    position:relative;
}

.news-slider{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
}
.news-slider::-webkit-scrollbar{display:none;}

.news-slide{
    min-width:100vw;
    height:200px;
    position:relative;
    scroll-snap-align:start;
    background-size:cover;
    background-position:center;
}

.news-slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        180deg,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.7)
    );
}

.news-text{
    position:absolute;
    bottom:18px;
    left:18px;
    right:18px;
    z-index:2;
    color:#fff;
}
.news-text h3{
    font-size:1.15rem;
    font-weight:700;
}
.news-text p{
    font-size:0.85rem;
    opacity:0.95;
}

/* indicator */
.news-indicator{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:5;
}
.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    transition:0.3s;
}
.dot.active{
    width:18px;
    border-radius:10px;
    background:#10b981;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #dfe6d0, #a3b18a);
    display: flex;
    flex-direction: column;
    color: #065f46;
}

/* Header */
header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245,247,241,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
}

/* Logo & Brand */
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

.brand-name {
    font-size: 1.2rem;
    font-weight: 700;
    color: #065f46;
}

/* Menu */
.menu-btn {
    margin-left: auto;
    font-size: 28px;
    cursor: pointer;
    color: #10b981;
    position: relative;
}

.menu-dropdown {
    position: absolute;
    top: 40px;
    right: 0;
    background: rgba(245,247,241,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    display: none;
    min-width: 120px;
    z-index: 20;
}

.menu-dropdown button {
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    color: #065f46;
}

.menu-dropdown button:hover {
    background: rgba(16,185,129,0.1);
    color: #10b981;
}

/* Dashboard */
.dashboard {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    padding: 22px;
    max-width: 520px;
    margin: auto;
    width: 100%;
}

/* Card */
.card {
    background: rgba(245,247,241,0.9);
    border-radius: 26px;
    border: 1px solid rgba(0,0,0,0.08);
    height: 150px;
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: all 0.25s ease;
}

.card:hover { transform: translateY(-4px); }
.card:active { transform: scale(0.95); }

/* Icon */
.icon-box {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
}

.card-icon {
    font-size: 26px;
    color: #ffffff;
}

/* Fixed colors */
.icon-approval   { background: #10b981; }
.icon-notes      { background: #6366f1; }
.icon-timetable  { background: #f59e0b; }
.icon-booking    { background: #3b82f6; }
.icon-carrymark  { background: #ef4444; }
.icon-absence    { background: #8b5cf6; } 
.icon-importantdates { background: #14b8a6; } /* NEW card color */

/* Text */
.card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #065f46;
    text-align: center;
}

/* Footer */
footer {
    text-align: center;
    font-size: 0.8rem;
    color: #065f46;
    padding: 14px;
}

@media (max-width: 360px) {
    .dashboard { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="images.png" alt="E4U Logo">
        <span class="brand-name">E4U</span>
    </div>
    <div class="menu-btn" onclick="toggleMenu()">
        <span class="material-icons">menu</span>
        <div class="menu-dropdown" id="menuDropdown">
            <button onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<!-- ========== NEWS SLIDER (5 ITEMS) ========== -->
<div class="news-wrapper">
    <div class="news-slider" id="newsSlider">

        <div class="news-slide" style="background-image:url('yic.jpeg.jpeg')">
            <div class="news-text"><h3>Youth Innovation Competition</h3><p>"Unleash your inner innovator"</p></div>
        </div>

        <div class="news-slide" style="background-image:url('bgt.jpeg')">
            <div class="news-text"><h3>Brother's Got Talent</h3><p>"Unleash your inner talent"</p></div>
        </div>

        <div class="news-slide" style="background-image:url('denms.jpeg.jpeg')">
            <div class="news-text"><h3>Business Insights Week</h3><p>"Insight Today,Success Tomorrow"</p></div>
        </div>

        <div class="news-slide" style="background-image:url('pasarloka.jpeg.jpeg')">
            <div class="news-text"><h3>Pasar Loka</h3><p>"Al-Jurjani Parking Lot"</p></div>
        </div>

        <div class="news-slide" style="background-image:url('gaza.jpeg.jpeg')">
            <div class="news-text"><h3>Breaks The Silence</h3><p>"Break The Siege Of Gaza"</p></div>
        </div>

    </div>

    <div class="news-indicator" id="newsDots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>
</div>

<div class="dashboard">

    <!-- Approval -->
    <button class="card" onclick="location.href='approval.html'">
        <div class="icon-box icon-approval">
            <span class="material-icons card-icon">check_circle</span>
        </div>
        <div class="card-title">Outing Approval</div>
    </button>

    <!-- Lecture Notes -->
    <button class="card" onclick="location.href='letcurernote.html'">
        <div class="icon-box icon-notes">
            <span class="material-icons card-icon">menu_book</span>
        </div>
        <div class="card-title">Lecturer Notes</div>
    </button>

    <!-- Timetable -->
    <button class="card" onclick="location.href='letcurertimetable.html'">
        <div class="icon-box icon-timetable">
            <span class="material-icons card-icon">schedule</span>
        </div>
        <div class="card-title">Class Timetable</div>
    </button>

    <!-- Facility Booking -->
    <button class="card" onclick="location.href='letcurerbooking.html'">
        <div class="icon-box icon-booking">
            <span class="material-icons card-icon">event_available</span>
        </div>
        <div class="card-title">Facilities Booking</div>
    </button>

    <!-- Student Carry Mark -->
    <button class="card" onclick="location.href='carrymark.html'">
        <div class="icon-box icon-carrymark">
            <span class="material-icons card-icon">grading</span>
        </div>
        <div class="card-title">Student Carry Mark</div>
    </button>

    <!-- Absence Application -->
    <button class="card" onclick="location.href='absenceapproval.html'">
        <div class="icon-box icon-absence">
            <span class="material-icons card-icon">assignment_late</span>
        </div>
        <div class="card-title">Absence Approval</div>
    </button>

    <!-- Important Dates (NEW) -->
    <button class="card" onclick="location.href='letcurercalendar.html'">
        <div class="icon-box icon-importantdates">
            <span class="material-icons card-icon">event_note</span>
        </div>
        <div class="card-title">CFS Calendar</div>
    </button>

</div>

<footer>© 2026 IIUM · E4U</footer>

<script>
function toggleMenu() {
    const menu = document.getElementById("menuDropdown");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function logout() {
    window.location.href = "index.html";
}

document.addEventListener("click", function(event) {
    const menu = document.getElementById("menuDropdown");
    const btn = document.querySelector(".menu-btn");
    if (!btn.contains(event.target)) {
        menu.style.display = "none";
    }
});

const slider = document.getElementById("newsSlider");
const dots = document.querySelectorAll(".dot");

slider.addEventListener("scroll", () => {
    const index = Math.round(slider.scrollLeft / window.innerWidth);
    dots.forEach(dot => dot.classList.remove("active"));
    if(dots[index]) dots[index].classList.add("active");
});
</script>

</body>
</html>
