


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | E4U</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #dfe6d0, #a3b18a);
    display: flex;
    flex-direction: column;
    color: #1f2937;
}

/* Header */
header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245,247,241,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
}

/* Logo & Title */
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

.brand-name {
    font-size: 1.2rem;
    font-weight: 700;
    color: #065f46;
}

/* Menu */
.menu-btn {
    margin-left: auto;
    font-size: 28px;
    cursor: pointer;
    color: #10b981;
    position: relative;
}

.menu-dropdown {
    position: absolute;
    top: 40px;
    right: 0;
    background: rgba(245,247,241,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    display: none;
    min-width: 120px;
    z-index: 20;
}

.menu-dropdown button {
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    color: #065f46;
}

.menu-dropdown button:hover {
    background: rgba(16,185,129,0.1);
    color: #10b981;
}

/* Dashboard */
.dashboard {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    padding: 22px;
    max-width: 520px;
    margin: auto;
    width: 100%;
}

/* Card */
.card {
    background: rgba(245,247,241,0.9);
    backdrop-filter: blur(25px) saturate(160%);
    border-radius: 26px;
    border: 1px solid rgba(0,0,0,0.08);
    height: 150px;
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow:
        0 20px 40px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.25s ease;
}

.card:hover { transform: translateY(-4px); }
.card:active { transform: scale(0.95); }

/* Icon box */
.icon-box {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
}

.card-icon {
    font-size: 26px;
    color: #ffffff;
}

/* Fixed colors */
.icon-fees          { background: #10b981; }
.icon-outing        { background: #3b82f6; }
.icon-notes         { background: #6366f1; }
.icon-timetable     { background: #f59e0b; }
.icon-booking       { background: #14b8a6; }
.icon-result        { background: #ef4444; }
.icon-absence       { background: #8b5cf6; } /* Absence Application */
.icon-importantdates{ background: #0ea5e9; } /* Important Dates */

/* Text */
.card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #065f46;
    text-align: center;
}

/* Footer */
footer {
    text-align: center;
    font-size: 0.8rem;
    color: #065f46;
    padding: 14px;
}

@media (max-width: 360px) {
    .dashboard { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="images.png" alt="E4U Logo">
        <span class="brand-name">E4U</span>
    </div>
    <div class="menu-btn" onclick="toggleMenu()">
        <span class="material-icons">menu</span>
        <div class="menu-dropdown" id="menuDropdown">
            <button onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<div class="dashboard">

    <button class="card" onclick="location.href='fees.html'">
        <div class="icon-box icon-fees">
            <span class="material-icons card-icon">account_balance_wallet</span>
        </div>
        <div class="card-title">Tuition Fees</div>
    </button>

    <button class="card" onclick="location.href='outing.html'">
        <div class="icon-box icon-outing">
            <span class="material-icons card-icon">emoji_people</span>
        </div>
        <div class="card-title">Outing</div>
    </button>

    <button class="card" onclick="location.href='note.html'">
        <div class="icon-box icon-notes">
            <span class="material-icons card-icon">menu_book</span>
        </div>
        <div class="card-title">Lecture Notes</div>
    </button>

    <button class="card" onclick="location.href='timetable.html'">
        <div class="icon-box icon-timetable">
            <span class="material-icons card-icon">schedule</span>
        </div>
        <div class="card-title">Timetable</div>
    </button>

    <button class="card" onclick="location.href='booking.html'">
        <div class="icon-box icon-booking">
            <span class="material-icons card-icon">event_available</span>
        </div>
        <div class="card-title">Facility Booking</div>
    </button>

    <button class="card" onclick="location.href='result.html'">
        <div class="icon-box icon-result">
            <span class="material-icons card-icon">bar_chart</span>
        </div>
        <div class="card-title">Result Tracker</div>
    </button>

    <!-- Absence Application -->
    <button class="card" onclick="location.href='studentabsence.html'">
        <div class="icon-box icon-absence">
            <span class="material-icons card-icon">assignment_late</span>
        </div>
        <div class="card-title">Absence Application</div>
    </button>

    <!-- Important Dates (NEW) -->
    <button class="card" onclick="location.href='calendar.html'">
        <div class="icon-box icon-importantdates">
            <span class="material-icons card-icon">event_note</span>
        </div>
        <div class="card-title">CFS Calendar</div>
    </button>

</div>

<footer>© 2026 IIUM · E4U</footer>

<script>
function toggleMenu() {
    const menu = document.getElementById("menuDropdown");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function logout() {
    window.location.href = "index.html";
}

document.addEventListener("click", function(event) {
    const menu = document.getElementById("menuDropdown");
    const btn = document.querySelector(".menu-btn");
    if (!btn.contains(event.target)) {
        menu.style.display = "none";
    }
});
</script>

</body>
</html>
