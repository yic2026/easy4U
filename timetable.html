<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable | E4U</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(180deg,#dfe6d0,#a3b18a);
    color:#065f46;
}

/* Header */
header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(20px) saturate(180%);
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back-btn{
    font-size:22px;
    cursor:pointer;
    color:#10b981;
}

.brand{
    display:flex;
    align-items:center;
    gap:8px;
}

.brand img{
    width:32px;
    height:32px;
}

.brand-name{
    font-weight:700;
    font-size:1.1rem;
}

.page-title{
    margin-left:auto;
    font-weight:600;
}

/* Semester buttons */
.section-select{
    display:flex;
    gap:12px;
    padding:16px;
    overflow-x:auto;
}

.section-btn{
    padding:8px 16px;
    border-radius:18px;
    border:1px solid rgba(0,0,0,0.1);
    background:rgba(245,247,241,0.9);
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    color:#065f46;
}

.section-btn.active{
    background:#10b981;
    color:white;
}

/* Container */
.container{
    padding:16px;
    max-width:520px;
    margin:auto;
    overflow-x:auto;
}

/* Timetable */
.timetable{
    display:grid;
    grid-template-columns:60px repeat(5,1fr);
    gap:8px;
}

.time-label,
.day-label,
.empty,
.course{
    border-radius:14px;
    text-align:center;
    font-size:0.8rem;
}

.time-label{
    background:rgba(245,247,241,0.9);
    padding:6px 0;
}

.day-label{
    background:rgba(245,247,241,0.9);
    padding:8px 0;
    font-weight:600;
}

.empty{
    min-height:50px;
    background:rgba(245,247,241,0.5);
}

.course{
    min-height:50px;
    padding:6px 4px;
    font-weight:600;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.yellow{background:#f2c94c;color:#111;}
.orange{background:#f2994a;}
.purple{background:#9b51e0;}
</style>
</head>
