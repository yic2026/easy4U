<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Notes | E4U</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display","Segoe UI", system-ui, sans-serif;
}

body {
    min-height:100vh;
    background: linear-gradient(180deg, #dfe6d0, #a3b18a);
    color:#065f46;
}

/* Header */
header {
    position: sticky;
    top:0;
    z-index:10;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px) saturate(180%);
    padding: 16px;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    border-bottom: 1px solid rgba(255,255,255,0.4);
}

/* Back Button */
.back-btn {
    font-size:22px;
    cursor:pointer;
    color:#10b981;
}

/* Brand */
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

.brand-name {
    font-size: 1.1rem;
    font-weight:700;
    color:#065f46;
}

/* Section Buttons */
.section-select {
    display:flex;
    gap:10px;
    padding:16px;
    overflow-x:auto;
}

.section-btn {
    padding:6px 14px;
    border-radius:18px;
    border:1px solid rgba(0,0,0,0.08);
    background: rgba(245,247,241,0.9);
    color:#065f46;
    font-weight:600;
    cursor:pointer;
    transition: all 0.2s;
}

.section-btn.active {
    background:#10b981;
    color:#fff;
}

/* Container */
.container {
    max-width:520px;
    margin:auto;
    padding:22px;
}

/* Note Card */
.note-card {
    background: rgba(245,247,241,0.9);
    backdrop-filter: blur(25px) saturate(160%);
    border-radius: 24px;
    border:1px solid rgba(0,0,0,0.08);
    box-shadow: 0 20px 40px rgba(0,0,0,0.12),
                inset 0 1px 0 rgba(255,255,255,0.7);
    padding:18px;
    margin-bottom:18px;
}

/* Top row */
.note-top {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.subject {
    font-size:1rem;
    font-weight:600;
}

.file-type {
    font-size:0.75rem;
    padding:4px 10px;
    border-radius:999px;
    background: rgba(16,185,129,0.15);
    color:#10b981;
}

/* Meta */
.meta {
    font-size:0.85rem;
    color:#065f46;
    margin-top:6px;
}

/* Action */
.note-action {
    margin-top:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.date {
    font-size:0.75rem;
    color:#065f46;
}

.btn {
    border:none;
    background: rgba(16,185,129,0.15);
    color:#10b981;
    padding:8px 14px;
    border-radius:12px;
    font-size:0.8rem;
    cursor:pointer;
}

.btn:active { opacity:0.6; }

/* Drag & Drop */
.drop-zone {
    margin:18px 0;
    padding:30px;
    border:2px dashed rgba(16,185,129,0.4);
    border-radius:16px;
    text-align:center;
    color:#10b981;
    font-weight:600;
    cursor:pointer;
    transition: background 0.2s;
}

.drop-zone.dragover {
    background: rgba(16,185,129,0.1);
}

/* Footer */
footer {
    text-align:center;
    font-size:0.8rem;
    color:#065f46;
    padding:14px;
}
</style>
</head>

<body>

<header>
    <span class="material-icons back-btn" onclick="location.href='letcurerhome.html'">
        arrow_back_ios
    </span>
    <div class="brand">
        <img src="images.png" alt="E4U Logo">
        <span class="brand-name">E4U</span>
    </div>
    <div style="margin-left:auto; font-weight:600;">Lecturer Notes</div>
</header>

<!-- Section Selector -->
<div class="section-select">
    <button class="section-btn active" onclick="loadSection('481', this)">Section 481</button>
    <button class="section-btn" onclick="loadSection('200', this)">Section 200</button>
    <button class="section-btn" onclick="loadSection('143', this)">Section 143</button>
</div>

<div class="container">

    <!-- Drag & Drop -->
    <div class="drop-zone" id="dropZone">
        Drag & Drop files here or click to upload
    </div>

    <!-- Notes List -->
    <div id="notesContainer"></div>

</div>

<footer>© 2026 IIUM · E4U</footer>

<script>
const notesContainer = document.getElementById("notesContainer");
const dropZone = document.getElementById("dropZone");

// Notes per section
let sectionNotes = {
    "481":[
        {subject:"Mathematics", fileType:"PDF", lecturer:"Mr. Ahmad", date:"12 Jan 2026"},
        {subject:"Algebra Notes", fileType:"PPT", lecturer:"Mr. Ahmad", date:"10 Jan 2026"}
    ],
    "200":[
        {subject:"Computer Science", fileType:"PPT", lecturer:"Dr. Siti", date:"10 Jan 2026"},
        {subject:"OOP Lab Guide", fileType:"PDF", lecturer:"Dr. Siti", date:"8 Jan 2026"}
    ],
    "143":[
        {subject:"Physics", fileType:"PDF", lecturer:"Mr. Farhan", date:"8 Jan 2026"},
        {subject:"Chemistry Notes", fileType:"PPT", lecturer:"Ms. Nur", date:"5 Jan 2026"}
    ]
};

let currentSection = "481";

function renderNotes(){
    notesContainer.innerHTML="";
    let notes = sectionNotes[currentSection];
    notes.forEach(note=>{
        const card = document.createElement("div");
        card.className="note-card";
        card.innerHTML=`
            <div class="note-top">
                <div class="subject">${note.subject}</div>
                <div class="file-type">${note.fileType}</div>
            </div>
            <div class="meta">Lecturer: ${note.lecturer}</div>
            <div class="note-action">
                <div class="date">Uploaded: ${note.date}</div>
                <button class="btn">View</button>
            </div>
        `;
        notesContainer.appendChild(card);
    });
}

function loadSection(section, btn){
    document.querySelectorAll('.section-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSection = section;
    renderNotes();
}

// Drag & Drop handlers
dropZone.addEventListener("click", ()=>fileInput.click());
dropZone.addEventListener("dragover", e=>{
    e.preventDefault();
    dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", e=>{
    dropZone.classList.remove("dragover");
});
dropZone.addEventListener("drop", e=>{
    e.preventDefault();
    dropZone.classList.remove("dragover");
    handleFiles(e.dataTransfer.files);
});

// Hidden file input
const fileInput = document.createElement("input");
fileInput.type="file";
fileInput.multiple=true;
fileInput.style.display="none";
fileInput.addEventListener("change", ()=>handleFiles(fileInput.files));
document.body.appendChild(fileInput);

// Handle uploaded files
function handleFiles(files){
    for(let file of files){
        sectionNotes[currentSection].unshift({
            subject:file.name.split('.')[0],
            fileType:file.name.split('.').pop().toUpperCase(),
            lecturer:"Lecturer Name",
            date: new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})
        });
    }
    renderNotes();
}

// Initial render
renderNotes();
</script>

</body>
</html>
