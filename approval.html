<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outing Approval | E4U</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display","Segoe UI", system-ui, sans-serif;
}

body {
    min-height:100vh;
    background: linear-gradient(180deg, #dfe6d0, #a3b18a);
    color:#1f2937;
}

/* Header */
header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245,247,241,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
}

/* Back Arrow */
.back-btn {
    font-size: 22px;
    cursor: pointer;
    color: #10b981;
}

/* Brand */
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

.brand-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: #065f46;
}

/* Page Title */
.page-title {
    margin-left: auto;
    font-size: 1.1rem;
    font-weight: 600;
    color: #065f46;
}

/* Table Card */
.table-card {
    background: rgba(245,247,241,0.9);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-radius: 24px;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow:
        0 10px 20px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.5);
    padding: 16px;
    margin: 16px auto;
    max-width: 100%;
    overflow-x: auto;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
}

th, td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

th {
    font-weight: 600;
    background: rgba(220,237,221,0.9);
    position: sticky;
    top: 0;
    color:#065f46;
}

td:first-child, th:first-child {
    text-align: left;
    min-width: 140px;
}

/* Status badges */
.status {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
}

.status.pending {
    background: rgba(203,219,197,0.3);
    color: #65a30d;
}

.status.approved {
    background: rgba(16,185,129,0.2);
    color: #10b981;
}

.status.rejected {
    background: rgba(239,68,68,0.2);
    color: #ef4444;
}

/* Buttons */
.btn {
    padding: 4px 10px;
    font-size: 0.75rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn.approve {
    background: rgba(16,185,129,0.2);
    color: #10b981;
}

.btn.reject {
    background: rgba(239,68,68,0.2);
    color: #ef4444;
}

.btn:hover {
    opacity: 0.8;
}

.btn:active {
    opacity: 0.6;
}

/* Footer */
footer {
    text-align: center;
    font-size: 0.75rem;
    color: #6b7280;
    padding: 14px;
}
</style>
</head>

<body>

<header>
    <span class="material-icons back-btn" onclick="location.href='letcurerhome.html'">
        arrow_back_ios
    </span>

    <div class="brand">
        <img src="images.png" alt="E4U Logo">
        <span class="brand-name">E4U</span>
    </div>

    <div class="page-title">Outing Approval</div>
</header>

<div class="table-card">
    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Outing Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Guardian Name</th>
                <th>Contact</th>
                <th>Relation</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="outingTable"></tbody>
    </table>
</div>

<footer>© 2026 E4U</footer>

<script>
const outings = [
    {name:"Ahmad Zikri", type:"Medical", start:"2026-01-20", end:"2026-01-21", guardian:"Mr. Hassan", contact:"0123456789", relation:"Father", status:"pending"},
    {name:"Aisyah Nur", type:"Personal", start:"2026-01-22", end:"2026-01-22", guardian:"Mrs. Iman", contact:"0198765432", relation:"Mother", status:"pending"},
    {name:"Muhammad Danish", type:"Family", start:"2026-01-23", end:"2026-01-25", guardian:"Mr. Amir", contact:"0112233445", relation:"Uncle", status:"pending"}
];

const tbody = document.getElementById("outingTable");

function renderOutings() {
    tbody.innerHTML = "";
    outings.forEach((o,i) => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${o.name}</td>
            <td>${o.type}</td>
            <td>${o.start}</td>
            <td>${o.end}</td>
            <td>${o.guardian}</td>
            <td>${o.contact}</td>
            <td>${o.relation}</td>
            <td><span class="status ${o.status}">${o.status.charAt(0).toUpperCase() + o.status.slice(1)}</span></td>
            <td>
                <button class="btn approve" onclick="updateStatus(${i},'approved')">Approve</button>
                <button class="btn reject" onclick="updateStatus(${i},'rejected')">Reject</button>
            </td>
        `;
        tbody.appendChild(row);
    });
}

function updateStatus(index, status) {
    outings[index].status = status;
    renderOutings();
}

renderOutings();
</script>

</body>
</html>
