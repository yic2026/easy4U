<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Timetable | E4U</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #dfe6d0, #a3b18a);
    color: #1f2937;
}

/* Header */
header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245,247,241,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
}

.back-btn {
    font-size: 22px;
    cursor: pointer;
    color: #10b981;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 32px;
    height: 32px;
}

.brand-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: #065f46;
}

.page-title {
    margin-left: auto;
    font-size: 1.1rem;
    font-weight: 600;
    color: #065f46;
}

/* Section Buttons */
.section-select {
    display: flex;
    gap: 12px;
    padding: 16px;
    overflow-x: auto;
}

.section-btn {
    padding: 8px 16px;
    border-radius: 18px;
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(245,247,241,0.9);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    color: #065f46;
    transition: all 0.2s;
}

.section-btn.active {
    background: #10b981;
    color: #fff;
}

/* Table Card */
.table-card {
    background: rgba(245,247,241,0.9);
    backdrop-filter: blur(25px) saturate(160%);
    border-radius: 24px;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    padding: 16px;
    margin: 16px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
}

colgroup col {
    width: 140px;
}

colgroup col:first-child {
    width: 120px;
}

th, td {
    padding: 12px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    white-space: nowrap;
}

th {
    background: rgba(220,237,221,0.9);
    font-weight: 600;
    color: #065f46;
}

td:first-child, th:first-child {
    text-align: left;
}

/* Footer */
footer {
    text-align: center;
    font-size: 0.75rem;
    color: #6b7280;
    padding: 14px;
}
</style>
</head>

<body>

<header>
    <span class="material-icons back-btn" onclick="location.href='letcurerhome.html'">
        arrow_back_ios
    </span>

    <div class="brand">
        <img src="images.png" alt="E4U Logo">
        <span class="brand-name">E4U</span>
    </div>

    <div class="page-title">Class Timetable</div>
</header>

<div class="section-select">
    <button class="section-btn active" onclick="loadSection('481',this)">Section 481</button>
    <button class="section-btn" onclick="loadSection('200',this)">Section 200</button>
    <button class="section-btn" onclick="loadSection('143',this)">Section 143</button>
</div>

<div class="table-card">
    <table>
        <colgroup>
            <col>
            <col>
            <col>
            <col>
            <col>
        </colgroup>
        <thead>
            <tr>
                <th>Day</th>
                <th>8–10 AM</th>
                <th>10–12 PM</th>
                <th>2–4 PM</th>
                <th>4–6 PM</th>
            </tr>
        </thead>
        <tbody id="timetableBody"></tbody>
    </table>
</div>

<footer>© 2026 E4U</footer>

<script>
const timetables = {
    "481": [
        ["Monday","Web Dev Lab","—","—","—"],
        ["Tuesday","—","Database","—","—"],
        ["Wednesday","—","—","Web Dev Lecture","—"],
        ["Thursday","—","—","—","Project Supervision"],
        ["Friday","—","—","—","—"]
    ],
    "200": [
        ["Monday","—","OOP Lecture","—","—"],
        ["Tuesday","—","—","OOP Lab","—"],
        ["Wednesday","—","—","—","—"],
        ["Thursday","—","Data Structure","—","—"],
        ["Friday","—","—","—","—"]
    ],
    "143": [
        ["Monday","Math Comp","—","—","—"],
        ["Tuesday","—","—","—","—"],
        ["Wednesday","—","Programming","—","—"],
        ["Thursday","—","—","—","Tutorial"],
        ["Friday","—","—","—","—"]
    ]
};

function loadSection(section, btn){
    document.querySelectorAll('.section-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    const body = document.getElementById("timetableBody");
    body.innerHTML = "";

    timetables[section].forEach(row=>{
        const tr = document.createElement("tr");
        tr.innerHTML = row.map(cell=>`<td>${cell}</td>`).join("");
        body.appendChild(tr);
    });
}

// load default section
loadSection("481", document.querySelector(".section-btn.active"));
</script>

</body>
</html>
