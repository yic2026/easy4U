<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E4U Login</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #dfe6d0, #a3b18a);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Login Card */
.login-card {
    width: 100%;
    max-width: 380px;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(30px);
    border-radius: 28px;
    padding: 32px 26px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
}

/* Header */
.app-header {
    text-align: center;
    margin-bottom: 22px;
}

.app-header img {
    width: 72px;
    margin-bottom: 10px;
}

.app-name {
    font-size: 1.6rem;
    font-weight: 700;
    color: #065f46;
}

.app-sub {
    font-size: 0.8rem;
    color: #134e4a;
}

/* Inputs */
.input-group {
    margin-bottom: 16px;
}

.input-group label {
    font-size: 0.8rem;
    margin-bottom: 6px;
    display: block;
}

.input-group input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.1);
}

/* Role Selector */
.role-select {
    display: flex;
    gap: 12px;
    margin: 18px 0 22px;
}

.role-option {
    flex: 1;
}

.role-option input {
    display: none;
}

/* Role Card */
.role-card {
    padding: 16px;
    border-radius: 18px;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.12);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: 
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
}

/* Click (press) effect */
.role-card:active {
    transform: scale(0.96);
}

/* Student */
.role-option input[value="student"] + .role-card {
    border-color: rgba(34,197,94,0.5);
}

.role-option input[value="student"] + .role-card .material-icons {
    color: #16a34a;
}

/* Lecturer */
.role-option input[value="lecturer"] + .role-card {
    border-color: rgba(59,130,246,0.5);
}

.role-option input[value="lecturer"] + .role-card .material-icons {
    color: #2563eb;
}

/* Icon */
.material-icons {
    font-size: 30px;
}

/* Text */
.role-text {
    font-size: 0.85rem;
    font-weight: 600;
}

/* SELECTED EFFECT */
.role-option input:checked + .role-card {
    box-shadow: 
        0 14px 28px rgba(0,0,0,0.18),
        0 0 0 3px rgba(19,78,74,0.25); /* ring */
    transform: translateY(-2px);
}

/* Button */
.login-btn {
    width: 100%;
    padding: 14px;
    border-radius: 18px;
    border: none;
    background: #134e4a;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.login-btn:active {
    transform: scale(0.96);
}

/* Footer */
.footer-text {
    margin-top: 18px;
    text-align: center;
    font-size: 0.75rem;
    color: #065f46;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="app-header">
        <img src="images.png">
        <div class="app-name">CFS IIUM · E4U</div>
        <div class="app-sub">IIUM Student & Lecturer Portal</div>
    </div>

    <div class="input-group">
        <label>Email</label>
        <input type="email">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password">
    </div>

    <div class="role-select">
        <label class="role-option">
            <input type="radio" name="role" value="student" checked>
            <div class="role-card">
                <span class="material-icons">school</span>
                <span class="role-text">Student</span>
            </div>
        </label>

        <label class="role-option">
            <input type="radio" name="role" value="lecturer">
            <div class="role-card">
                <span class="material-icons">person</span>
                <span class="role-text">Lecturer</span>
            </div>
        </label>
    </div>

    <button class="login-btn" onclick="login()">Login</button>

    <div class="footer-text">© 2026 IIUM · E4U</div>
</div>

<script>
function login() {
    const role = document.querySelector('input[name="role"]:checked').value;
    if (role === "student") {
        window.location.href = "home.html";
    } else {
        window.location.href = "letcurerhome.html";
    }
}
</script>

</body>
</html>
